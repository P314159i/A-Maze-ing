[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "Reusable maze generator for the A-Maze-ing project"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
pythonpath = ["."]

[tool.mypy]
strict = true
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
exclude = [
    ".venv",
    "__pycache__",
    ".pytest_cache",
]

[tool.flake8]
exclude = [
    ".venv",
    "__pycache__",
    ".pytest_cache",
    ".git",
]
